name: Ponte de comando

on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/**", ".github/workflows/ponte.yml"]

permissions:
  contents: write

concurrency:
  group: ponte
  cancel-in-progress: true

jobs:
  paineis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gerar painéis
        env:
          # METRICS_TOKEN (PAT com read:user + repo) inclui contribuições privadas;
          # sem ele, cai no GITHUB_TOKEN e conta só o que é público.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/ponte.py --user ${{ github.repository_owner }} --out assets
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: atualiza painéis da ponte" && git push
