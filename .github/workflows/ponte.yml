name: Ponte de comando

on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/**", ".github/workflows/ponte.yml"]

permissions:
  contents: write

concurrency:
  group: ponte
  cancel-in-progress: true

jobs:
  paineis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gerar painéis
        env:
          # PAT com read:user + repo: o GITHUB_TOKEN não enxerga contribuições privadas
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret METRICS_TOKEN ausente — mantendo os painéis atuais."
            exit 0
          fi
          python .github/scripts/ponte.py --user ${{ github.repository_owner }} --out assets
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "chore: atualiza painéis da ponte" && git push; }
